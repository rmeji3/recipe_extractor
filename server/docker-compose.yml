# Local development dependencies. Not a deployment artifact.
services:
  postgres:
    image: postgres:17-alpine
    container_name: recipe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: recipe
      POSTGRES_USER: postgres
      # Local only. Matches ConnectionStrings:AppDb in appsettings.Development.json.
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d recipe"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The v1 fetch/extraction queue for the TikTok path. Nothing uses it yet.
  redis:
    image: redis:7-alpine
    container_name: recipe-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
